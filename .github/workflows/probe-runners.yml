name: Probe runners

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-27, macos-latest, macos-26-xlarge]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcrun simctl list runtimes
