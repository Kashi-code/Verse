name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bump to 27 (and the deployment target in project.yml) once runners ship Xcode 27.
  XCODE_MAJOR: "26"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_${XCODE_MAJOR}.*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            ls -d /Applications/Xcode*.app
            echo "::error::Xcode ${XCODE_MAJOR} is not installed on this runner image"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick newest iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r --arg major "$XCODE_MAJOR" '
            .devices | to_entries
            | map(select(.key | test("iOS-" + $major + "-")))
            | sort_by(.key | sub(".*iOS-"; "") | split("-") | map(tonumber))
            | last | .value[]
            | select(.name | startswith("iPhone")) | .udid' | head -1)
          if [ -z "$UDID" ]; then
            xcrun simctl list runtimes
            echo "::error::No iOS ${XCODE_MAJOR} iPhone simulator found"
            exit 1
          fi
          xcrun simctl list devices | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Verse.xcodeproj \
            -scheme Verse \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi

      - name: Build unsigned iPhone app (.ipa)
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Verse.xcodeproj \
            -scheme Verse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi
          mkdir -p Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Verse.app Payload/
          zip -qry Verse.ipa Payload
          ls -lh Verse.ipa

      - name: Upload .ipa
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: Verse-ipa
          path: Verse.ipa
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
